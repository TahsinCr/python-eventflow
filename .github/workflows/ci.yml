name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.10'
        run: python run_tests.py

      - name: Measure package and branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m pip install "coverage>=7.6,<8"
          python -m coverage run --branch --source=eventflow -m unittest discover -s tests
          python -m coverage report --include="eventflow/*" --fail-under=88
          python -m coverage report --include="eventflow/pipeline/*" --fail-under=90
          python -m coverage report --include="eventflow/callback.py" --fail-under=86
          python -m coverage report --include="eventflow/_callbacks.py" --fail-under=84
          python -m coverage report --include="eventflow/base.py" --fail-under=90
          python -m coverage report --include="eventflow/async_event_bus.py" --fail-under=89
          python -m coverage report --include="eventflow/bridges.py" --fail-under=80
          python -m coverage report --include="eventflow/tasks.py" --fail-under=79
          python -m coverage report --include="eventflow/scheduling.py" --fail-under=81
          python -m coverage report --include="eventflow/resilience.py" --fail-under=82

  native-runtime:
    name: Native runtime Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install EventFlow and native build tools
        run: python -m pip install -e ".[dev,native-bench]"

      - name: Build and validate optional native kernels
        shell: bash
        env:
          EVENTFLOW_NATIVE_BUILD: ${{ runner.temp }}/eventflow-native
        run: |
          python -m benchmarks.native.build --build-dir "$EVENTFLOW_NATIVE_BUILD"
          PYTHONPATH="$EVENTFLOW_NATIVE_BUILD" python -m benchmarks.native.validate c
          PYTHONPATH="$EVENTFLOW_NATIVE_BUILD" python -m benchmarks.native.validate cython

      - name: Run the complete suite through the experimental runtime kernels
        env:
          EVENTFLOW_EXPERIMENTAL_HISTORY_BACKEND: cython
          EVENTFLOW_EXPERIMENTAL_ROUTING_BACKEND: c
          PYTHONPATH: ${{ runner.temp }}/eventflow-native
        run: python run_tests.py

  native-wheel:
    name: Experimental native wheel Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install native build tools
        run: python -m pip install -e ".[native-bench]" build

      - name: Build the source distribution
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          output = Path(os.environ["RUNNER_TEMP"]) / "native-dist"
          output.mkdir(parents=True, exist_ok=True)
          subprocess.run(
              [sys.executable, "-m", "build", "--sdist", "--outdir", str(output)],
              check=True,
          )
          PY

      - name: Build a native-enabled wheel from the source distribution
        shell: bash
        env:
          EVENTFLOW_BUILD_NATIVE: "1"
          EVENTFLOW_NATIVE_BUILD_DIR: ${{ runner.temp }}/native-build
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          temporary = Path(os.environ["RUNNER_TEMP"])
          distributions = list((temporary / "native-dist").glob("*.tar.gz"))
          if len(distributions) != 1:
              raise RuntimeError(f"expected one source distribution, found {len(distributions)}")
          output = temporary / "native-wheel"
          output.mkdir(parents=True, exist_ok=True)
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "build",
                  "--wheel",
                  "--no-isolation",
                  "--outdir",
                  str(output),
                  str(distributions[0]),
              ],
              check=True,
          )
          PY

      - name: Install the native-enabled wheel
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "native-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"expected one native wheel, found {len(wheels)}")
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--force-reinstall",
                  "--no-deps",
                  str(wheels[0]),
              ],
              check=True,
          )
          PY

      - name: Verify wheel extensions and installed runtime behavior
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          EVENTFLOW_EXPERIMENTAL_HISTORY_BACKEND: cython
          EVENTFLOW_EXPERIMENTAL_ROUTING_BACKEND: c
        run: |
          python - <<'PY'
          import os
          from importlib import import_module
          from importlib.machinery import EXTENSION_SUFFIXES
          from pathlib import Path
          import subprocess
          import sys

          os.chdir(Path(os.environ["RUNNER_TEMP"]))
          for name in ("eventflow_native_c", "eventflow_native_cython"):
              module = import_module(name)
              if not any(module.__file__.endswith(suffix) for suffix in EXTENSION_SUFFIXES):
                  raise RuntimeError(f"{name} is not a compiled extension")
          subprocess.run(
              [
                  sys.executable,
                  str(Path(os.environ["GITHUB_WORKSPACE"]) / "tests/test_native_runtime.py"),
              ],
              check=True,
          )
          PY

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and lint rules
        run: |
          ruff check .
          ruff format --check .

  typing:
    name: Pyright Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check public package types
        run: |
          pyright --pythonversion "${{ matrix.python-version }}"
          pyright examples benchmarks --pythonversion "${{ matrix.python-version }}"

  free-threaded:
    name: Python ${{ matrix.python-version }} with GIL disabled on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14t", "3.15t"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up free-threaded Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev,native-bench]"

      - name: Verify GIL is disabled
        env:
          PYTHON_GIL: "0"
        run: python -c 'import sys, sysconfig; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled()'

      - name: Run unit tests without the GIL
        env:
          PYTHON_GIL: "0"
          PYTHONASYNCIODEBUG: "1"
          PYTHONWARNINGS: error
        run: python run_tests.py

      - name: Build and validate optional native kernels without the GIL
        shell: bash
        env:
          EVENTFLOW_NATIVE_BUILD: ${{ runner.temp }}/eventflow-native
          PYTHON_GIL: "0"
        run: |
          python -m benchmarks.native.build --build-dir "$EVENTFLOW_NATIVE_BUILD"
          PYTHONPATH="$EVENTFLOW_NATIVE_BUILD" python -m benchmarks.native.validate c
          PYTHONPATH="$EVENTFLOW_NATIVE_BUILD" python -m benchmarks.native.validate cython

      - name: Run the complete native runtime suite without the GIL
        env:
          EVENTFLOW_EXPERIMENTAL_HISTORY_BACKEND: cython
          EVENTFLOW_EXPERIMENTAL_ROUTING_BACKEND: c
          PYTHON_GIL: "0"
          PYTHONASYNCIODEBUG: "1"
          PYTHONWARNINGS: error
          PYTHONPATH: ${{ runner.temp }}/eventflow-native
        run: python run_tests.py

  dependency-audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install dependency audit tool
        run: python -m pip install "pip-audit>=2.7,<3"

      - name: Audit declared runtime dependencies
        run: pip-audit .

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install distribution tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify and test the source distribution
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          archive = max(
              Path("dist").glob("*.tar.gz"),
              key=lambda candidate: candidate.stat().st_mtime_ns,
          )
          with tarfile.open(archive, "r:gz") as source_archive:
              members = source_archive.getnames()
              root_name = members[0].split("/", 1)[0]
              relative_members = {
                  name[len(root_name) + 1 :]
                  for name in members
                  if name.startswith(root_name + "/")
              }
              required = {
                  "setup.py",
                  "benchmarks/benchmark_native.py",
                  "benchmarks/native/build.py",
                  "benchmarks/native/kernels.c",
                  "benchmarks/native/kernels.pyx",
                  "tests/test_native_benchmarks.py",
                  "tests/test_native_runtime.py",
                  "tests/api_v1_4_0.json",
              }
              missing = required - relative_members
              assert not missing, f"source distribution is missing: {sorted(missing)}"
              generated = sorted(
                  name for name in relative_members if name.startswith("benchmarks/results/")
              )
              assert not generated, f"generated benchmark results were packaged: {generated[:5]}"

              with tempfile.TemporaryDirectory() as temporary_directory:
                  source_archive.extractall(temporary_directory)
                  source_root = Path(temporary_directory) / root_name
                  subprocess.run(
                      [sys.executable, "-m", "pip", "install", str(source_root)],
                      check=True,
                  )
                  environment = os.environ.copy()
                  existing_pythonpath = environment.get("PYTHONPATH")
                  environment["PYTHONPATH"] = str(source_root) + (
                      os.pathsep + existing_pythonpath if existing_pythonpath else ""
                  )
                  subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "unittest",
                          "discover",
                          "--start-directory",
                          "tests",
                      ],
                      cwd=source_root,
                      env=environment,
                      check=True,
                  )
          PY

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Build a wheel from the source distribution
        run: python -m build --wheel --outdir "${{ runner.temp }}/from-sdist" dist/*.tar.gz

      - name: Install optional native benchmark build tool
        run: python -m pip install "Cython>=3.1,<4"

      - name: Build and validate benchmark-only native kernels
        env:
          EVENTFLOW_NATIVE_BUILD: ${{ runner.temp }}/eventflow-native
        run: |
          python -m benchmarks.native.build --build-dir "$EVENTFLOW_NATIVE_BUILD"
          PYTHONPATH="$EVENTFLOW_NATIVE_BUILD" python -m benchmarks.native.validate c
          PYTHONPATH="$EVENTFLOW_NATIVE_BUILD" python -m benchmarks.native.validate cython

      - name: Install the source-built wheel
        run: python -m pip install "${{ runner.temp }}/from-sdist/"*.whl

      - name: Verify installed package metadata, typing marker, and runtime API
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from importlib import import_module
          from pathlib import Path
          import asyncio

          import eventflow

          assert version("flowevent") == eventflow.__version__
          assert (Path(eventflow.__file__).parent / "py.typed").is_file()
          for module in (
              "bridges", "cache", "concurrency", "executors", "observability",
              "policy", "registry", "resilience", "scheduling", "scopes",
              "state", "tasks", "timing",
          ):
              import_module(f"eventflow.{module}")
          assert eventflow.Pipeline[int]().run(1) == 1
          assert eventflow.EventEnvelope[int](1).event == 1

          async def smoke():
              pipeline = eventflow.AsyncPipeline[int]()
              assert await pipeline.run(2) == 2
              async def source():
                  yield 3
              stream = eventflow.AsyncStream(source()).map(pipeline.run).buffer(1)
              async with stream:
                  assert [value async for value in stream] == [3]
              async with eventflow.AsyncSubscriptionScope():
                  pass
          asyncio.run(smoke())
          PY
