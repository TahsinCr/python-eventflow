name: Wheels

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archs: x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            archs: aarch64
          - os: macos-15-intel
            target: macos-x86_64
            archs: x86_64
          - os: macos-15
            target: macos-arm64
            archs: arm64
          - os: windows-latest
            target: windows-amd64
            archs: AMD64
          - os: windows-11-arm
            target: windows-arm64
            archs: ARM64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and test wheels with cibuildwheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
        with:
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Build sdist
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-distributions:
    name: Verify wheels and sdist metadata
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Validate distribution metadata and matrix coverage
        run: |
          python -m pip install "twine>=6,<7"
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path

          files = sorted(path.name for path in Path("dist").iterdir())
          sdists = [name for name in files if name.endswith(".tar.gz")]
          wheels = [name for name in files if name.endswith(".whl")]
          assert len(sdists) == 1, files
          for required_platform in (
              "manylinux",
              "musllinux",
              "x86_64",
              "aarch64",
              "macosx",
              "arm64",
              "win_amd64",
              "win_arm64",
          ):
              assert any(required_platform in wheel for wheel in wheels), (
                  f"missing wheel for {required_platform}: {wheels}"
              )
          print(f"Verified 1 sdist and {len(wheels)} compiled wheels.")
          PY
