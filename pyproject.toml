[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eventflow"
version = "1.0"
description = "EventFlow: synchronous and asynchronous event delivery for Python."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["event-bus", "event-driven", "asyncio", "pub-sub"]
authors = [
  { name = "TahsinCr", email = "Tahsincr@outlook.com" },
]

dependencies = [
  "backports.strenum>=1.3.1,<2; python_version < '3.11'",
  "exceptiongroup>=1.3.1,<2; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/TahsinCr/python-eventflow"
Repository = "https://github.com/TahsinCr/python-eventflow"
Changelog = "https://github.com/TahsinCr/python-eventflow/blob/main/CHANGELOG.md"
Issues = "https://github.com/TahsinCr/python-eventflow/issues"

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eventflow*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".serena", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B023"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["eventflow"]
exclude = ["tests"]
